name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Typecheck is CRM-only for now — `pnpm typecheck` via turbo
       # catches pre-existing errors in apps/club-sites (brief: see
       # docs/production-readiness). Expand to monorepo-wide once those
       # land.
      - name: Typecheck
        run: pnpm --filter @torny/crm typecheck

      - name: Test
        run: pnpm test
