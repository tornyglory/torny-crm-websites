name: Deploy CRM to Azure SWA

on:
  push:
    branches: [main]
    paths:
      - 'apps/crm/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/crm-azure-swa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/crm/**'
      - 'packages/**'
  workflow_dispatch: {}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build CRM
        run: pnpm --filter @torny/crm build
        env:
          VITE_SAM_BASE_URL: ${{ secrets.VITE_SAM_BASE_URL }}
          VITE_CRM_BASE_URL: ${{ secrets.VITE_CRM_BASE_URL }}
          VITE_MEDIA_BASE_URL: ${{ secrets.VITE_MEDIA_BASE_URL }}
          VITE_SITES_ORIGIN: ${{ secrets.VITE_SITES_ORIGIN }}
          VITE_SITES_HOST_SUFFIX: ${{ secrets.VITE_SITES_HOST_SUFFIX }}
          # Sentry: ships the DSN into the bundle + uploads sourcemaps.
          # All three SENTRY_* vars must be set for the vite-plugin to
          # run; unset = plugin skipped and no sourcemaps uploaded.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_API_TOKEN_CRM }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: apps/crm/dist
          output_location: ""
          skip_app_build: true
          skip_api_build: true
          # Dependabot PRs (and any PR from a fork) can't read the SWA
          # api token, so the deploy step would always fail on them
          # with "ApiToken is invalid". Letting it skip-on-missing-secrets
          # makes the build step still prove the code is buildable
          # without lighting up a false red on the PR.
          skip_deploy_on_missing_secrets: true
