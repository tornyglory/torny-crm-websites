name = "torny-crm-websites"
compatibility_date = "2024-10-01"
pages_build_output_dir = "dist"

# ── KV: host → clubId mapping for fast edge tenant resolution ─────────────
# Created with: wrangler kv namespace create TORNY_KV
# The CRM writes to it whenever a club adds a domain.
[[kv_namespaces]]
binding = "TORNY_KV"
id = "630c2c36dafc4947bb07dd053e06e744"

# ── Secrets (set via `wrangler pages secret put ...` or the Pages dashboard) ──
# NUXT_TORNY_API_BASE_URL
# NUXT_REVALIDATE_SECRET

[vars]
NUXT_PUBLIC_SITE_URL = "https://sites.torny.co"
